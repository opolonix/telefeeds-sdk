syntax = "proto3";
package telefeeds.providers.v1;

service ProviderGateway {
  rpc Connect(stream ProviderFrame) returns (stream ProviderFrame);
}
service ProviderAdmin {
  rpc Call(ProviderCall) returns (stream ProviderEvent);
}
message ProviderFrame {
  string request_id = 1;
  string kind = 2;
  string data = 3;
  int32 interface_id = 4;
}
message ProviderCall {
  int64 client_id = 1;
  int64 bot_id = 2;
  string operation = 3;
  string integration_id = 4;
  optional int32 interface_id = 5;
  string key = 6;
  string args_json = 7;
  uint64 offset = 8;
  string source_revision = 9;
}
message ProviderEvent {
  string integration_id = 1;
  int32 interface_id = 2;
  string request_id = 3;
  string kind = 4;
  string data = 5;
}
