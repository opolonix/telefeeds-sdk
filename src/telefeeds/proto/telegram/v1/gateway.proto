syntax = "proto3";

package telefeeds.telegram.v1;

import "google/protobuf/timestamp.proto";

// Public Telegram user-session gateway. Every RPC requires the metadata header
// `authorization: Bearer <integration_access_token>`.
// Authorization failures include `telefeeds-error-code` trailing metadata whose
// value is the matching AuthorizationErrorCode enum value name.
service TelegramGateway {
  rpc Subscribe(SubscribeRequest) returns (stream UpdateEnvelope);
  rpc Invoke(InvokeRequest) returns (InvokeResponse);
  rpc GetSessionSnapshots(GetSessionSnapshotsRequest) returns (GetSessionSnapshotsResponse);
  rpc BeginPhoneAuthorization(BeginPhoneAuthorizationRequest) returns (BeginPhoneAuthorizationResponse);
  rpc CompletePhoneAuthorization(CompletePhoneAuthorizationRequest) returns (CompletePhoneAuthorizationResponse);
  rpc CompletePasswordAuthorization(CompletePasswordAuthorizationRequest) returns (CompletePasswordAuthorizationResponse);
  rpc BeginExistingSessionAuthorization(BeginExistingSessionAuthorizationRequest) returns (BeginExistingSessionAuthorizationResponse);
  rpc CompleteExistingSessionAuthorization(CompleteExistingSessionAuthorizationRequest) returns (CompleteExistingSessionAuthorizationResponse);
}

message SubscribeRequest {
  optional int32 interface = 1;
  optional bool close_other = 2;
  int32 tl_layer = 3;
}

message UpdateEnvelope {
  int64 session_peer_id = 1;
  string session_kind = 2;
  bytes body = 3;
  google.protobuf.Timestamp received_at = 4;
  int32 tl_layer = 5;
}

message InvokeRequest {
  int64 session_peer_id = 1;
  bytes body = 2;
  optional int32 dc_id = 3;
  int32 tl_layer = 4;
}

message InvokeResponse {
  bytes body = 1;
  optional string error = 2;
  optional TelegramRpcError rpc_error = 3;
}

message TelegramRpcError {
  int32 code = 1;
  string name = 2;
  optional uint32 value = 3;
  optional uint32 caused_by = 4;
}

message GetSessionSnapshotsRequest {
  repeated int64 session_peer_ids = 1;
}

message GetSessionSnapshotsResponse {
  repeated SessionSnapshot sessions = 1;
}

message SessionSnapshot {
  int64 session_peer_id = 1;
  string state = 2;
  bool alive = 3;
  bool fatal = 4;
  bool proxy_broken = 5;
  uint64 uptime_ms = 6;
  double updates_per_second = 7;
  double invokes_per_second = 8;
  uint64 invokes_in_flight = 9;
  uint64 memory_bytes = 10;
  uint64 updates_total = 11;
  uint64 invokes_total = 12;
  optional string last_error = 13;
  google.protobuf.Timestamp updated_at = 14;
  uint64 media_upload_bytes = 15;
  uint64 media_download_bytes = 16;
  uint64 media_requests_total = 17;
  uint64 media_requests_in_flight = 18;
  optional int32 tl_layer = 19;
  uint64 usage_days = 20;
  optional google.protobuf.Timestamp last_usage_at = 21;
}

enum AuthorizationKind {
  AUTHORIZATION_KIND_UNSPECIFIED = 0;
  // Новый вход в Telegram с выпуском или заменой MTProto auth key.
  AUTHORIZATION_KIND_NATIVE = 1;
  // Подтверждение владения уже существующей сессией без замены auth key.
  AUTHORIZATION_KIND_PROVIDER = 2;
}

enum AuthorizationErrorCode {
  AUTHORIZATION_ERROR_CODE_UNSPECIFIED = 0;
  AUTHORIZATION_ERROR_CODE_CREDENTIALS_REQUIRED = 1;
  AUTHORIZATION_ERROR_CODE_CREDENTIALS_INVALID = 2;
  AUTHORIZATION_ERROR_CODE_ATTEMPT_INVALID = 3;
  AUTHORIZATION_ERROR_CODE_ATTEMPT_NOT_FOUND = 4;
  AUTHORIZATION_ERROR_CODE_ATTEMPT_FORBIDDEN = 5;
  AUTHORIZATION_ERROR_CODE_ATTEMPT_EXPIRED = 6;
  AUTHORIZATION_ERROR_CODE_PHONE_INVALID = 7;
  AUTHORIZATION_ERROR_CODE_PHONE_BANNED = 8;
  AUTHORIZATION_ERROR_CODE_CODE_INVALID = 9;
  AUTHORIZATION_ERROR_CODE_CODE_EXPIRED = 10;
  AUTHORIZATION_ERROR_CODE_PASSWORD_INVALID = 11;
  AUTHORIZATION_ERROR_CODE_PASSWORD_NOT_EXPECTED = 12;
  AUTHORIZATION_ERROR_CODE_SIGN_UP_REQUIRED = 13;
  AUTHORIZATION_ERROR_CODE_SESSION_ACCESS_DISABLED = 14;
  AUTHORIZATION_ERROR_CODE_PROVIDER_UNAVAILABLE = 15;
  AUTHORIZATION_ERROR_CODE_PERMISSION_DENIED = 16;
  AUTHORIZATION_ERROR_CODE_RATE_LIMITED = 17;
}

enum AuthorizationCodeProviderKind {
  AUTHORIZATION_CODE_PROVIDER_KIND_UNSPECIFIED = 0;
  AUTHORIZATION_CODE_PROVIDER_KIND_TELEGRAM_GATEWAY = 1;
  AUTHORIZATION_CODE_PROVIDER_KIND_TELEGRAM_BOT = 2;
}

message AuthorizationCodeProvider {
  AuthorizationCodeProviderKind kind = 1;
  // Ссылка, которую нужно показать пользователю для получения кода.
  optional string url = 2;
  // Одноразовый непрозрачный токен провайдера. Это не код подтверждения.
  optional string code_secret = 3;
  // true означает, что доставить код напрямую не удалось и ссылку нужно открыть.
  bool requires_open_url = 4;
}

message BeginPhoneAuthorizationRequest {
  string phone_number = 1;
}

message BeginPhoneAuthorizationResponse {
  string authorization_id = 1;
  google.protobuf.Timestamp expires_at = 2;
  optional uint32 code_length = 3;
  AuthorizationKind authorization_kind = 4;
  optional AuthorizationCodeProvider code_provider = 5;
}

message BeginExistingSessionAuthorizationRequest {
  int64 session_peer_id = 1;
}

message BeginExistingSessionAuthorizationResponse {
  string authorization_id = 1;
  google.protobuf.Timestamp expires_at = 2;
  uint32 code_length = 3;
  AuthorizationKind authorization_kind = 4;
  AuthorizationCodeProvider code_provider = 5;
}

message CompleteExistingSessionAuthorizationRequest {
  string authorization_id = 1;
  string code = 2;
}

message CompleteExistingSessionAuthorizationResponse {
  SessionRegistration session = 1;
}

message CompletePhoneAuthorizationRequest {
  string authorization_id = 1;
  string code = 2;
}

enum PhoneAuthorizationState {
  PHONE_AUTHORIZATION_STATE_UNSPECIFIED = 0;
  PHONE_AUTHORIZATION_STATE_PASSWORD_REQUIRED = 1;
  PHONE_AUTHORIZATION_STATE_AUTHORIZED = 2;
}

message CompletePhoneAuthorizationResponse {
  PhoneAuthorizationState state = 1;
  optional string password_hint = 2;
  optional SessionRegistration session = 3;
}

message CompletePasswordAuthorizationRequest {
  string authorization_id = 1;
  string password = 2;
}

message CompletePasswordAuthorizationResponse {
  SessionRegistration session = 1;
}

message SessionRegistration {
  int64 session_peer_id = 1;
  string state = 2;
}
